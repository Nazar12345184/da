<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elogika World Cup 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top, rgba(87, 128, 255, 0.18), transparent 35%),
                linear-gradient(180deg, #1f276b 0%, #101420 100%);
            color: #f2f2f2;
            min-height: 100vh;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 18px;
        }

        header {
            background: rgba(10, 12, 30, 0.95);
            padding: 14px 18px;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 40px;
            border-radius: 0 0 18px 18px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.28);
            margin-bottom: 22px;
        }

        .left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo img {
            height: 60px;
            width: auto;
            filter: drop-shadow(0 0 16px rgba(255, 103, 0, 0.45));
        }

        nav {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 6px 10px;
            font-size: 18px;
            font-family: 'Arial', sans-serif;
        }

        nav a:hover {
            color: white;
        }

        .gay {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-family: 'Arial', sans-serif;
        }

        .btn:active {
            transform: scale(0.88);
            transition: transform 0.08s ease-out;
        }

        .btn {
            background-color: #ff6700;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            box-shadow: 0 14px 26px rgba(255, 103, 0, 0.22);
            cursor: pointer;
            margin: 0;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 18px 30px rgba(255, 103, 0, 0.28);
        }

        .profile-card {
            max-width: 760px;
            width: 100%;
            margin: 42px auto;
            background: rgba(15, 18, 45, 0.96);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
            padding: 34px;
            backdrop-filter: blur(10px);
        }

        .profile-card h1 {
            margin-bottom: 14px;
            font-size: 2.4rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .profile-list {
            list-style: none;
            padding: 0;
            margin: 0 0 24px;
            display: grid;
            gap: 12px;
        }

        .profile-list li {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .profile-list li span:first-child {
            color: #aab4ff;
            font-weight: 600;
        }

        .profile-list li span:last-child {
            color: #ffb868;
            font-weight: 700;
        }

        .results {
            display: grid;
            grid-template-columns: repeat(2, minmax(220px, 1fr));
            gap: 12px;
            max-width: 980px;
            margin: 12px auto 28px;
            padding: 0;
            background: transparent;
            border: none;
            box-shadow: none;
        }

        .results > .result-card:last-child {
            grid-column: 1 / -1;
            justify-self: center;
            max-width: 520px;
        }

        .result-card {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            gap: 64px;
            padding: 12px 14px;
            background: rgba(15, 18, 45, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
        }

        .result-title {
            font-size: 1rem;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .result-title:hover {
            color: #5d7eda;
        }

        .result-score {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            color: #ffb868;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="left">
                <div class="logo">
                    <img src="../templates/gg.png" alt="Logo">
                </div>
            </div>
            <nav class="gay">
                <button class="btn" onclick="location.href='../templates/main.html'">news</button>
                <button class="btn" onclick="location.href='../templates/index.html'">matches</button>
                <button class="btn" onclick="location.href='../templates/res.html'">results</button>
                <button class="btn" onclick="location.href='../templates/events.html'">events</button>
                <button class="btn" onclick="location.href='../templates/players.html'">players</button>
                <button class="btn" onclick="location.href='../templates/stats.html'">stats</button>
                <button class="btn" onclick="location.href='../templates/media.html'">media</button>
            </nav>
        </header>

        <section class="profile-card">
            <h1>Elogika World Cup 2026</h1>
            <ul class="profile-list">
                <li><span>Tournament</span><span>Сеточный турнир(no playoff)</span></li>
                <li><span>Date</span><span>Aug 12th - Aug 23rd</span></li>
                <li><span>Prize Pool</span><span>$1,500,000</span></li>
                <li><span>Teams</span><span>16</span></li>
                <li><span>Location</span><span>whole world Online</span></li>
            </ul>
            <h1>Results</h1>
            <div class="results">
                <article class="result-card">
                    <div>
                        <div class="result-title" onclick="location.href='../templates/match1.html'">BARBOS vs OPPONENT</div>
                    </div>
                    <div>
                        <div class="result-score">2:0</div>
                    </div>
                </article>
                <article class="result-card">
                    <div>
                        <div class="result-title" onclick="location.href='../templates/match2.html'">BARBOS vs NAVI</div>
                    </div>
                    <div>
                        <div class="result-score">3:2</div>
                    </div>
                </article>
                <article class="result-card">
                    <div>
                        <div class="result-title" onclick="location.href='../templates/match3.html'">Team SPIRIT vs NAVI</div>
                    </div>
                    <div>
                        <div class="result-score">1:2</div>
                    </div>
                </article>
            </div>
        </section>
    </div>
</body>
</html>
