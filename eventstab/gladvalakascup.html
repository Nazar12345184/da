<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glad Valakas cup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top, rgba(87, 128, 255, 0.18), transparent 35%),
                linear-gradient(180deg, #1f276b 0%, #101420 100%);
            color: #f2f2f2;
            min-height: 100vh;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 18px;
        }

        header {
            background: rgba(10, 12, 30, 0.95);
            padding: 14px 18px;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 40px;
            border-radius: 0 0 18px 18px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.28);
            margin-bottom: 22px;
        }

        .left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo img {
            height: 60px;
            width: auto;
            filter: drop-shadow(0 0 16px rgba(255, 103, 0, 0.45));
        }

        nav {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 6px 10px;
            font-size: 18px;
            font-family: 'Arial', sans-serif;
        }

        nav a:hover {
            color: white;
        }

        .gay {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-family: 'Arial', sans-serif;
        }

        .btn:active {
            transform: scale(0.88);
            transition: transform 0.08s ease-out;
        }

        .btn {
            background-color: #ff6700;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            box-shadow: 0 14px 26px rgba(255, 103, 0, 0.22);
            cursor: pointer;
            margin: 0;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 18px 30px rgba(255, 103, 0, 0.28);
        }

        .profile-card {
            max-width: 760px;
            width: 100%;
            margin: 42px auto;
            background: rgba(15, 18, 45, 0.96);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
            padding: 34px;
            backdrop-filter: blur(10px);
        }

        .profile-card h1 {
            margin-bottom: 14px;
            font-size: 2.4rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .profile-list {
            list-style: none;
            padding: 0;
            margin: 0 0 24px;
            display: grid;
            gap: 12px;
        }

        .profile-list li {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .profile-list li span:first-child {
            color: #aab4ff;
            font-weight: 600;
        }

        .profile-list li span:last-child {
            color: #ffb868;
            font-weight: 700;
        }

        .result-player {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: rgba(15, 18, 45, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            margin-top: 12px;
        }

        .result-player img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #ffb868;
        }

        .result-player .player-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
        }

        .result-player .player-result {
            font-size: 1.2rem;
            font-weight: 700;
            color: #4caf50;
            margin-left: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="left">
                <div class="logo">
                    <img src="../templates/gg.png" alt="Logo">
                </div>
            </div>
            <nav class="gay">
                <button class="btn" onclick="location.href='../templates/main.html'">news</button>
                <button class="btn" onclick="location.href='../templates/index.html'">matches</button>
                <button class="btn" onclick="location.href='../templates/res.html'">results</button>
                <button class="btn" onclick="location.href='../templates/events.html'">events</button>
                <button class="btn" onclick="location.href='../templates/players.html'">players</button>
                <button class="btn" onclick="location.href='../templates/stats.html'">stats</button>
                <button class="btn" onclick="location.href='../templates/media.html'">media</button>
            </nav>
        </header>

        <section class="profile-card">
            <h1>Glad Valakas cup</h1>
            <ul class="profile-list">
                <li><span>Tournament</span><span>Пажилой турнир</span></li>
                <li><span>Date</span><span>Aug 1st - Aug 6th</span></li>
                <li><span>Prize Pool</span><span>$50,000</span></li>
                <li><span>TEAMS</span><span>16</span></li>
                <li><span>Location</span><span>Samara</span></li>
            </ul>

            <h1 style="margin-top: 30px;">RESULTS</h1>
            <div class="result-player">
                <img src="penisdetrov.png" alt="winnerz">
                <span class="player-name">team Penis Detrov</span>
                <span class="player-result">Win</span>
            </div>
        </section>
    </div>
</body>
</html>
