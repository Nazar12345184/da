<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Kyiv Cup is ready to start</title>
	<style>
		:root {
			--ink: #f2f2f2;
			--muted: #c9d0f2;
			--orange: #ff6700;
			--line: rgba(255, 255, 255, 0.12);
			--paper: rgba(20, 24, 55, 0.96);
			--wash: #101420;
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			background: radial-gradient(circle at top, rgba(87, 128, 255, 0.18), transparent 35%),
				linear-gradient(180deg, #1f276b 0%, #101420 100%);
			color: var(--ink);
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			line-height: 1.6;
			min-height: 100vh;
		}

		.page {
			width: min(100% - 32px, 920px);
			margin: 0 auto;
		}

		header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 14px 20px;
			background: rgba(10, 12, 30, 0.95);
			border-bottom: 1px solid var(--line);
			border-radius: 0 0 18px 18px;
			box-shadow: 0 20px 50px rgba(0, 0, 0, 0.28);
			font-family: Arial, sans-serif;
		}

		.brand {
			color: var(--ink);
			font-size: 20px;
			font-weight: 800;
			letter-spacing: 0.02em;
			text-decoration: none;
		}

		.back-link {
			color: var(--orange);
			font-size: 14px;
			font-weight: 700;
			text-decoration: none;
		}

		article {
			max-width: 720px;
			margin: 88px auto 100px;
			padding: 48px;
			background: linear-gradient(145deg, rgba(38, 48, 116, 0.94), var(--paper));
			border: 1px solid var(--line);
			border-radius: 12px;
			box-shadow: 0 18px 38px rgba(0, 0, 0, 0.24);
		}

		.eyebrow {
			color: var(--orange);
			font-family: Arial, sans-serif;
			font-size: 12px;
			font-weight: 800;
			letter-spacing: 0.1em;
			text-transform: uppercase;
		}

		h1 {
			margin: 16px 0 12px;
			font-size: clamp(38px, 7vw, 68px);
			line-height: 1.05;
		}

		.date {
			color: var(--muted);
			font-family: Arial, sans-serif;
			font-size: 14px;
		}

		.lead {
			margin-top: 42px;
			color: #e4e7fa;
			font-size: 21px;
		}

		.copy {
			margin-top: 24px;
			color: var(--muted);
			font-size: 17px;
		}

		.back-link:hover {
			color: #ff9b5d;
		}

		@media (max-width: 600px) {
			header {
				padding: 20px 0;
			}

			article {
				margin-top: 42px;
				padding: 28px 22px;
			}

			.lead {
				margin-top: 30px;
				font-size: 19px;
			}
		}
	</style>
</head>
<body>
	<div class="page">
		<header>
			<a class="brand" href="../templates/main.html">Bet-King - ти король</a>
			<a class="back-link" href="../templates/main.html">до навин</a>
		</header>

		<main>
			<article>
				<p class="eyebrow">b1t на рахунок вильоту з фіналу турніру</p>
				<h1>BLAST Open Kyiv 2026</h1>
				<p class="date">18 August 2026</p>
				<p class="lead">так це справді сумно що ми вилетіли з турніру саме так, ми справді були близько до перемоги але не змогли.</p>
				<p class="copy">Команда Barbos обіграла команду Navi в фіналі турніру.</p>
			</article>
		</main>
	</div>
</body>
</html>
