<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NA1ZEL — Профіль гравця</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top, rgba(87, 128, 255, 0.18), transparent 35%),
                linear-gradient(180deg, #1f276b 0%, #101420 100%);
            color: #f2f2f2;
            min-height: 100vh;
            overflow-y: auto;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        body::-webkit-scrollbar {
            display: none;
        }
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 18px;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }
        .left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .logo img {
            height: 48px;
            width: auto;
            filter: drop-shadow(0 0 16px rgba(255, 103, 0, 0.45));
        }
        nav {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        nav a {
            color: white;
            text-decoration: none;
            padding: 6px 10px;
            font-size: 18px;
            font-family: 'Arial', sans-serif;
        }
        nav a:hover {
            color: white;
        }
        .gay {
            display: flex;
            gap: 34px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            font-size: 16px;
            font-family: 'Arial', sans-serif;
        }
        .btn {
            background-color: #ff6700;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 10px;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            box-shadow: 0 12px 24px rgba(255, 103, 0, 0.22);
            cursor: pointer;
            margin: 0;
            font-size: 16px;
        }
        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 18px 30px rgba(255, 103, 0, 0.28);
        }
        .btn:active {
            transform: scale(0.96);
            transition: transform 0.08s ease-out;
        }
        .profile-card {
            max-width: 760px;
            width: 100%;
            margin: 42px 0;
            background: rgba(15, 18, 45, 0.96);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
            padding: 34px;
            backdrop-filter: blur(10px);
        }
        .profile-card h1 {
            margin-bottom: 14px;
            font-size: 2.4rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .profile-card .subtitle {
            color: #c8d4ff;
            margin-bottom: 20px;
            font-size: 1rem;
            opacity: 0.9;
        }
        .profile-card p {
            line-height: 1.8;
            color: #e9ecff;
            margin-bottom: 18px;
        }
        .profile-list {
            list-style: none;
            padding: 0;
            margin: 0 0 24px;
            display: grid;
            gap: 12px;
        }
        .profile-list li {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .profile-list li span:first-child {
            color: #aab4ff;
            font-weight: 600;
        }
        .profile-list li span:last-child {
            color: #ffb868;
            font-weight: 700;
        }
        .back-link {
            display: inline-block;
            color: #ffb868;
            text-decoration: none;
            font-weight: 700;
            border: 1px solid rgba(255, 184, 104, 0.35);
            padding: 10px 16px;
            border-radius: 999px;
            transition: background 0.2s ease, transform 0.2s ease;
        }
        .back-link:hover {
            background: rgba(255, 103, 0, 0.12);
            transform: translateY(-1px);
        }

        header {
            width: 100%;
            background: rgba(10, 12, 30, 0.95);
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            border-radius: 0 0 14px 14px;
            box-shadow: 0 14px 35px rgba(0, 0, 0, 0.22);
            margin-bottom: 18px;
        }

        .header-inner {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .header-nav .btn {
            margin: 2px 4px;
        }

        .results {
            display: grid;
            grid-template-columns: repeat(2, minmax(220px, 1fr));
            gap: 12px;
            max-width: 980px;
            margin: 12px auto 28px;
            padding: 0;
            background: transparent;
            border: none;
            box-shadow: none;
        }

.results > .result-card:last-child {
    grid-column: 1 / -1;
    justify-self: center;
    max-width: 520px;
}

.result-card {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 64px;
    padding: 12px 14px;
    background: rgba(15, 18, 45, 0.95);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 14px;
}

.result-title {
    font-size: 1rem;
    font-weight: 700;
    color: #ffffff;
}

.result-subtitle {
    color: #c8d4ff;
    opacity: 0.9;
    margin-top: 4px;
}

.result-score {
    font-size: 1.8rem;
    font-weight: 800;
    letter-spacing: -0.04em;
    color: #ffb868;
    text-align: right;
}
    </style>
</head>
<body>
<div class="ggg">
    <header>
        <div class="left">
            <div class="logo">
                <img src="gg.png" alt="Logo">
            </div>
        </div>
        <nav class="gay">
             <button class="btn" onclick="location.href='main.html'">news</button>
             <button class="btn" onclick="location.href='index.html'">matches</button>
             <button class="btn" onclick="location.href='res.html'">results</button>
             <button class="btn" onclick="location.href='events.html'">events</button>
             <button class="btn" onclick="location.href='players.html'">players</button>
             <button class="btn" onclick="location.href='stats.html'">stats</button>
             <button class="btn" onclick="location.href='media.html'">media</button>
        </nav>
    </header>

    <div class="container">
        <section class="profile-card">
            <h1>NA1ZEL</h1>
            <div class="subtitle">Entry Fragger</div>
            <p>NA1ZEL — новий гравець який показує хароші результати</p>
            <ul class="profile-list">
                <li><span>Нік</span><span>NAZAR NA1ZEL</span></li>
                <li><span>Роль</span><span>Entry Fragger</span></li>
                <li><span>Стиль</span><span>Агресивний</span></li>
            </ul>
            <h1>Недавні матчі</h1>
            <div class="results">
                <article class="result-card">
                    <div>
                        <div class="result-title" onclick="location.href='match2.html'">Barbos vs NAVI</div>
                    </div>
                    <div>
                        <div class="result-score">3:2</div>
                    </div>
                </article>
                <article class="result-card">
                    <div>
                        <div class="result-title" onclick="location.href='match1.html'">Barbos vs Opponent</div>
                    </div>
                    <div>
                        <div class="result-score">2:0</div>
                    </div>
                </article>
                <article class="result-card">
                    <div>
                        <div class="result-title" onclick="location.href='match6.html'">Barbos vs BC.GAME</div>
                    </div>
                    <div>
                        <div class="result-score">2:1</div>
                    </div>
                </article>
            </div>
        </section>
    </div>
</body>
</html>
