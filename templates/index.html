<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     
</head>
<style>

body{
  margin: 0;
  padding: 0;
  background-color: rgb(46, 38, 38);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  position: relative;
}



.top-left-img {
    position: absolute;
    top: -22px;
    left: -10px;
    padding: 0px;
}

.btn:active {
  transform: scale(0.88);
  transition: transform 0.08s ease-out;
}

.btn {
  
  background-color: #ff6700;
  color: white;
  border: none;
  padding: 10px 16px;
  border-radius: 8px;
  transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  
}

</style>
<body>

    <img class="top-left-img" src="gg.png" alt="Image" width="170" height="110">
    <button class="btn" onclick="location.href='main.html'">Click me</button>
    

   
</body>

<script>



function SquishButton({ children }) {
  return (
    <button
      style={{ transition: 'transform 0.5s cubic-bezier(0.34,1.56,0.64,1)' }}
      onPointerDown={(e) => {
        e.currentTarget.style.transition = 'transform 0.08s ease-out';
        e.currentTarget.style.transform = 'scale(0.88)';
      }}
      onPointerUp={(e) => {
        e.currentTarget.style.transition =
          'transform 0.5s cubic-bezier(0.34,1.56,0.64,1)';
        e.currentTarget.style.transform = 'scale(1)';
      }}
    >
      {children}
    </button>
  );
}

</script>

</html>
