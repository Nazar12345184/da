<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: rgb(31, 39, 107);
    min-height: 100vh;
}

.container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 20px;
}


header {
    background: #1a1a1a;
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
}

.left {
    display: flex;
    align-items: center;
    gap: 20px;
}

.logo img {
    height: 30px;
    width: auto;
}

nav {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    justify-content: center;
}

nav a {
    color: white;
    text-decoration: none;
    padding: 6px 10px;
    font-size: 20px;
    font-family: 'Arial', sans-serif;
}

nav a:hover {
    color: white;
}

.gay{
    display: flex;
    gap: 60px;
    flex-wrap: wrap;
    align-items: center;
    margin: 0 auto;
    font-size: 28px;
    font-family: 'Arial', sans-serif;
}



</style>

<body>

<div class="container">

    <header>
        <div class="left">
            <div class="logo">
                <img src="gg.png" alt="Logo">
            </div>
        </div>
        <nav class = "gay">
            <a href="#">Даун</a>
            <a href="#">Даун</a>
            <a href="#">Даун</a>
            <a href="#">Даун</a>
            <a href="#">Даун</a>
        </nav>
    </header>

</div>

</body>
</html>
