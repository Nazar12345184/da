<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: rgb(31, 39, 107);
    min-height: 100vh;
}

.container {
    max-width: 1600px;
    margin: 0 auto;
  
}


header {
    background: #1a1a1a;
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
}

.left {
    display: flex;
    align-items: center;
    gap: 20px;
}

.logo img {
    height: 60px;
    width: auto;
}

nav {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    justify-content: center;
}

nav a {
    color: white;
    text-decoration: none;
    padding: 6px 10px;
    font-size: 20px;
    font-family: 'Arial', sans-serif;
}

nav a:hover {
    color: white;
}

.gay{
    display: flex;
    gap: 60px;
    flex-wrap: wrap;
    align-items: center;
    margin: 0 auto;
    font-size: 28px;
    font-family: 'Arial', sans-serif;
}

.btn:active {
  transform: scale(0.88);
  transition: transform 0.08s ease-out;
}

.btn {
  
  background-color: #ff6700;
  color: white;
  border: none;
  padding: 10px 16px;
  border-radius: 8px;
  transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  margin: 10px;
  
}



</style>

<body>

<div class="container">

    <header>
        <div class="left">
            <div class="logo">
                <img src="gg.png" alt="Logo">
            </div>
        </div>
        <nav class = "gay">
             <button class="btn" onclick="location.href='main.html'">news</button>
             <button class="btn" onclick="location.href='index.html'">matches</button>
             <button class="btn" onclick="location.href='res.html'">results</button>
             <button class="btn" onclick="location.href='events.html'">events</button>
             <button class="btn" onclick="location.href='players.html'">players</button>
             <button class="btn" onclick="location.href='stats.html'">stats</button>
             <button class="btn" onclick="location.href='media.html'">media</button>
        </nav>
    </header>

</div>

</body>
</html>
