<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match 1</title>
</head>
<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: radial-gradient(circle at top, rgba(87, 128, 255, 0.18), transparent 35%),
        linear-gradient(180deg, #1f276b 0%, #101420 100%);
    color: #f2f2f2;
    min-height: 100vh;
}

.container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 18px;
}

header {
    background: rgba(10, 12, 30, 0.95);
    padding: 16px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    border-radius: 0 0 20px 20px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.32);
}

.left {
    display: flex;
    align-items: center;
    gap: 20px;
}

.logo img {
    height: 56px;
    width: auto;
    filter: drop-shadow(0 0 16px rgba(255, 103, 0, 0.45));
}

nav {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    justify-content: center;
}

nav a {
    color: white;
    text-decoration: none;
    padding: 6px 10px;
    font-size: 20px;
    font-family: 'Arial', sans-serif;
}

nav a:hover {
    color: white;
}

.gay {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    margin: 0 auto;
    font-size: 18px;
    font-family: 'Arial', sans-serif;
}

.btn {
    background-color: #ff6700;
    color: white;
    border: none;
    padding: 14px 24px;
    border-radius: 12px;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    box-shadow: 0 16px 30px rgba(255, 103, 0, 0.24);
    cursor: pointer;
    margin: 6px 10px;
}

.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 22px 40px rgba(255, 103, 0, 0.32);
}

.btn:active {
    transform: scale(0.94);
    transition: transform 0.08s ease-out;
}

h1 {
    margin: 36px auto 18px;
    text-align: center;
    font-size: 3rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
}

.barbos,
.results {
    max-width: 980px;
    margin: 0 auto 26px;
    padding: 24px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 26px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.28);
    backdrop-filter: blur(10px);
}

.barbos p {
    color: #d6d9ff;
    font-size: 1.05rem;
    text-align: center;
}

.results {
    display: grid;
    gap: 16px;
}

.result-card {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 16px;
    padding: 18px;
    background: rgba(15, 18, 45, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 18px;
}

.result-title {
    font-size: 1.18rem;
    font-weight: 700;
    color: #ffffff;
}

.inline-title {
    display: flex;
    gap: 140px;
    flex-wrap: wrap;
    align-items: center;
    font-size: 0.95rem;
    font-weight: 600;
    color: #f7f7ff;
}

.title-part {
    display: inline-block;
    white-space: nowrap;
}

.result-subtitle {
    color: #c8d4ff;
    opacity: 0.9;
    margin-top: 6px;
}

.result-score {
    font-size: 3rem;
    font-weight: 800;
    letter-spacing: -0.04em;
    color: #ffb868;
    text-align: right;
}

.score-label {
    font-size: 0.95rem;
    color: #e5e9ff;
    opacity: 0.75;
    margin-top: 6px;
    text-align: right;
}

</style>

<body>

<div class="container">

    <header>
        <div class="left">
            <div class="logo">
                <img src="gg.png" alt="Logo">
            </div>
        </div>
        <nav class="gay">
             <button class="btn" onclick="location.href='main.html'">news</button>
             <button class="btn" onclick="location.href='index.html'">matches</button>
             <button class="btn" onclick="location.href='res.html'">results</button>
             <button class="btn" onclick="location.href='events.html'">events</button>
             <button class="btn" onclick="location.href='players.html'">players</button>
             <button class="btn" onclick="location.href='stats.html'">stats</button>
             <button class="btn" onclick="location.href='media.html'">media</button>
        </nav>
    </header>

</div>

<h1>team SPIRIT VS FALCONS</h1>

<div class="results">
    <article class="result-card">
        <div>
            <div class="result-title">team SPIRIT vs FALCONS</div>
            <div class="result-subtitle">чверть фінал</div>
        </div>
        <div>
            <div class="result-score">13 : 5 - train</div>
            <div class="result-score">13 : 3 - mirage</div>
            
            
        </div>
    </article>
    <article class="result-card">
        <div>
            <div class="result-title inline-title">
                <span class="title-part">MVP OF MATCH - donk</span>
                <span class="title-part">POINTS - 78</span>
                <span class="title-part">K/D - 1.64</span>
            </div>
        </div>
        <div>
        </div>
    </article>
</div>

</body>
</html>
