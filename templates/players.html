<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Players</title>
</head>
<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: radial-gradient(circle at top, rgba(87, 128, 255, 0.18), transparent 35%),
        linear-gradient(180deg, #1f276b 0%, #101420 100%);
    color: #f2f2f2;
    min-height: 100vh;
}

.container {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 18px;
}

header {
    background: rgba(10, 12, 30, 0.95);
    padding: 14px 18px;
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 40px;
    border-radius: 0 0 18px 18px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.28);
    margin-bottom: 22px;
}

.left {
    display: flex;
    align-items: center;
    gap: 16px;
}

.logo img {
    height: 60px;
    width: auto;
    filter: drop-shadow(0 0 16px rgba(255, 103, 0, 0.45));
}

nav {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
}

nav a {
    color: white;
    text-decoration: none;
    padding: 6px 10px;
    font-size: 18px;
    font-family: 'Arial', sans-serif;
}

nav a:hover {
    color: white;
}

.gay {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-family: 'Arial', sans-serif;
}

.btn {
    background-color: #ff6700;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 10px;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    box-shadow: 0 14px 26px rgba(255, 103, 0, 0.22);
    cursor: pointer;
    margin: 0;
}

.btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 18px 30px rgba(255, 103, 0, 0.28);
}

.btn:active {
    transform: scale(0.96);
    transition: transform 0.08s ease-out;
}

.page-title {
    margin: 28px auto 14px;
    text-align: center;
    font-size: 2.2rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
}

.players {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 18px;
    max-width: 1180px;
    margin: 0 auto 32px;
}

.player-card {
    background: rgba(15, 18, 45, 0.95);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.24);
    backdrop-filter: blur(10px);
    display: grid;
    gap: 16px;
}

.player-card h2 {
    font-size: 1.25rem;
    color: #ffffff;
}

.player-card p {
    color: #c8d4ff;
    line-height: 1.6;
    opacity: 0.92;
}

.player-meta {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
}

.player-badge {
    background: rgba(255, 103, 0, 0.12);
    color: #ffb868;
    padding: 8px 12px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 0.9rem;
}

.player-role {
    color: #b8c7ff;
    font-size: 0.95rem;
    opacity: 0.9;
}

.card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}

.card-footer span {
    font-size: 0.95rem;
    color: #e5e9ff;
    opacity: 0.8;
}

.card-link {
    color: #ffb868;
    text-decoration: none;
    font-weight: 700;
}

.card-link:hover {
    text-decoration: underline;
}

.player-card h2:hover {
    color: #5d7eda;
    cursor: pointer;    
}

</style>

<body>

<div class="container">
    <header>
        <div class="left">
            <div class="logo">
                <img src="../templates/gg.png" alt="Logo">
            </div>
        </div>
        <nav class="gay">
             <button class="btn" onclick="location.href='../templates/main.html'">news</button>
             <button class="btn" onclick="location.href='../templates/index.html'">matches</button>
             <button class="btn" onclick="location.href='../templates/res.html'">results</button>
             <button class="btn" onclick="location.href='../templates/events.html'">events</button>
             <button class="btn" onclick="location.href='../templates/players.html'">players</button>
             <button class="btn" onclick="location.href='../templates/stats.html'">stats</button>
             <button class="btn" onclick="location.href='../templates/media.html'">media</button>
        </nav>
    </header>

    <h1 class="page-title">Players</h1>

    <div class="players">
        <article class="player-card">
            <h2 onclick="location.href='../templates/NA1ZEL.html'">NA1ZEL</h2>
            <div class="player-meta">
                <div class="player-badge">MVP</div>
                <div class="player-role">Entry Fragger</div>
            </div>
            <div class="card-footer">
                <span>K/D: 1.67</span>
                <span class="card-link">match7</span>
            </div>
        </article>

        <article class="player-card">
            <h2 onclick="location.href='../templates/DM1TrIy.html'">DM1TrIy</h2>
            <div class="player-meta">
                <div class="player-badge">Captain</div>
                <div class="player-role">Support</div>
            </div>
            <div class="card-footer">
                <span>Assists: 99 avg</span>
                <span class="card-link">match6</span>
            </div>
        </article>

        <article class="player-card">
            <h2 onclick="location.href='../templates/W0NDERFUL.html'">W0NDERFUL</h2>
            <div class="player-meta">
                <div class="player-badge">Sharpshooter</div>
                <div class="player-role">AWPer</div>
            </div>
            <div class="card-footer">
                <span>K/D: 1.59</span>
                <span class="card-link">match5</span>
            </div>
        </article>

        <article class="player-card">
            <h2 onclick="location.href='../templates/m0on.html'">m0on</h2>
            <div class="player-meta">
                <div class="player-badge">m0on</div>
                <div class="player-role">Support</div>
            </div>
            <div class="card-footer">
                <span>Barbos</span>
            </div>
        </article>
    </div>
</div>

</body>
</html>
