<!DOCTYPE html>
<html lang="uk">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>GG Arena</title>
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			display: grid;
			min-height: 100vh;
			place-items: center;
			padding: 24px;
			background: radial-gradient(circle at top, rgba(87, 128, 255, 0.18), transparent 35%),
				linear-gradient(180deg, #1f276b 0%, #101420 100%);
			color: #f2f2f2;
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
		}

		.card {
			width: min(100%, 560px);
			padding: 48px 42px;
			text-align: center;
			background: linear-gradient(145deg, rgba(38, 48, 116, 0.96), rgba(20, 24, 55, 0.98));
			border: 1px solid rgba(255, 255, 255, 0.14);
			border-radius: 16px;
			box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3), 0 0 28px rgba(87, 128, 255, 0.12);
		}

		.label {
			color: #ff9b5d;
			font-size: 13px;
			font-weight: 700;
			letter-spacing: 0.1em;
			text-transform: uppercase;
		}

		h1 {
			margin: 16px 0 12px;
			font-size: clamp(30px, 6vw, 48px);
			line-height: 1.1;
		}

		p {
			color: #c9d0f2;
			font-size: 17px;
			line-height: 1.6;
		}

		@media (max-width: 520px) {
			.card {
				padding: 36px 24px;
			}
		}
	</style>
</head>
<body>
	<main class="card">
		<p class="label">вернутись</p>
		<h1>верни мамі карточку і більше так не роби</h1>
		<p>зовсім уже на казіно рішив піти🙄.</p>
	</main>
</body>
</html>
